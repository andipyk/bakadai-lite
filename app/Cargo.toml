[package]
name = "bakadai_lite"
version = "0.2.0"
edition = "2021"
description = "Aplikasi stok & kasir ringan, offline-first, untuk Android (dan pratinjau desktop)"

[lib]
name = "bakadai_lite"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bakadai_lite"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.37"
rusqlite = { version = "0.32", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
rxing = { version = "0.9", default-features = false, features = ["decoders", "oned", "qrcode", "no_character_set_support"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "android-native-activity"] }
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
# Sudah ikut terpasang lewat android-activity; dipakai untuk menyembunyikan navigation bar Android (lib.rs).
jni = "0.22"
ndk-context = "0.1"
# Kamera NDK (Camera2 + AImageReader) untuk scan barcode; sudah ikut terpasang lewat android-activity.
ndk-sys = { version = "0.6", features = ["media"] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "0.30", default-features = false }

[target.'cfg(windows)'.dependencies]
winit = { version = "0.30", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# unwind (bukan abort): galat di dekoder barcode cukup diabaikan, aplikasi tidak tertutup paksa.
panic = "unwind"

# Dipakai oleh `cargo apk build --release` (lihat ANDROID.md)
[package.metadata.android]
package = "dev.harau.bakadailite"
apk_name = "BakadaiLite"
build_targets = ["aarch64-linux-android"]
resources = "android/res"

# Kunci tanda tangan (upload key Play Store): .tools/bakadai-lite.keystore, sandi di .tools/bakadai-lite.keystore.pass.
# build-apk.sh mengirimnya lewat env CARGO_APK_RELEASE_KEYSTORE(_PASSWORD), jadi sandi tidak ada di repo.

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 36

[package.metadata.android.application]
label = "Bakadai Lite"
icon = "@mipmap/ic_launcher"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.BLUETOOTH"
max_sdk_version = 30

[[package.metadata.android.uses_permission]]
name = "android.permission.BLUETOOTH_CONNECT"

[[package.metadata.android.uses_permission]]
name = "android.permission.CAMERA"

# Kamera tidak wajib: HP/tablet tanpa kamera tetap bisa memasang aplikasi (scan pakai scanner USB).
[[package.metadata.android.uses_feature]]
name = "android.hardware.camera"
required = false
